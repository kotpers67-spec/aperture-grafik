stages:
  - release

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Publishing $CI_COMMIT_TAG metadata on GitLab"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Aperture Grafik $CI_COMMIT_TAG"
    description: "See the GitHub release notes and download the signed Android APK from the linked asset."
    assets:
      links:
        - name: aperture-grafik.apk
          url: "https://github.com/santiyastudio-lgtm/aperture-grafik/releases/download/$CI_COMMIT_TAG/aperture-grafik.apk"
          link_type: package
